  <text x="200" y="458" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" letter-spacing="0.5">Sukhjinder Boparai</text>
  
  <!-- Divider -->
  <line x1="80" y1="472" x2="320" y2="472" stroke="#3A3845" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Restaurant Greeting -->
  <text x="200" y="492" text-anchor="middle" fill="#D4AF37" font-family="Georgia, serif" font-size="13" font-weight="bold">¡Gracias por elegir Sher e Punjab!</text>
  <text x="200" y="510" text-anchor="middle" fill="#A1A1AA" font-family="Georgia, serif" font-style="italic" font-size="12">Agradecemos tu preferencia</text>
  
  <!-- Heart and Location -->
  <g transform="translate(195, 520)">
    <path d="M5 2 C5 2, 2 0, 1 2 C0 4, 3 7, 5 9 C7 7, 10 4, 9 2 C8 0, 5 2, 5 2 Z" fill="#D4AF37" />
  </g>
  <text x="200" y="542" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" letter-spacing="2">QUITO • CUMBAYÁ</text>
