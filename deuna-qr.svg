  <!-- Center Deuna Logo (d!) -->
  <circle cx="200" cy="275" r="32" fill="#FFFFFF" />
  <circle cx="200" cy="275" r="28" fill="#18181B" />
  <text x="200" y="286" text-anchor="middle" fill="#00E5FF" font-family="system-ui, sans-serif" font-size="26" font-style="italic" font-weight="900">d!</text>

