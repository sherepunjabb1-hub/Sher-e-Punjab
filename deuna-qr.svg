    <rect x="320" y="215" width="15" height="15"/>
    <rect x="270" y="245" width="10" height="20"/>
    <rect x="290" y="245" width="20" height="10"/>
    <rect x="320" y="245" width="15" height="25"/>
    <rect x="270" y="275" width="30" height="10"/>
    <rect x="310" y="275" width="10" height="20"/>
    <rect x="270" y="305" width="20" height="10"/>
    <rect x="300" y="305" width="35" height="10"/>

