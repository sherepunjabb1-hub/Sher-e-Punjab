<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#241B0E"/>
      <stop offset="70%" stop-color="#120D06"/>
      <stop offset="100%" stop-color="#070503"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="30%" stop-color="#F3C64F"/>
      <stop offset="60%" stop-color="#D4AF37"/>
      <stop offset="90%" stop-color="#AA771C"/>
      <stop offset="100%" stop-color="#6E4B08"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#D4AF37" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Ring Background -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="14"/>
  <circle cx="256" cy="256" r="228" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="8 6" opacity="0.8"/>
  
  <!-- Subtle Inner Border -->
  <circle cx="256" cy="256" r="212" fill="#140E05" stroke="url(#goldGrad)" stroke-width="4" opacity="0.9"/>

  <!-- Ornate Crown / Diadem -->
  <g filter="url(#goldGlow)">
    <path d="M 175 160 L 205 200 L 256 140 L 307 200 L 337 160 L 328 220 L 184 220 Z" fill="url(#goldGrad)"/>
    <circle cx="175" cy="150" r="8" fill="#FFF3C4"/>
    <circle cx="256" cy="130" r="10" fill="#FFF3C4"/>
    <circle cx="337" cy="150" r="8" fill="#FFF3C4"/>
    <rect x="184" y="212" width="144" height="10" rx="3" fill="url(#goldGrad)"/>
    <circle cx="256" cy="217" r="3.5" fill="#140E05"/>
    <circle cx="220" cy="217" r="3" fill="#140E05"/>
    <circle cx="292" cy="217" r="3" fill="#140E05"/>
  </g>

  <!-- Central High-Contrast Royal 'S' Monogram -->
  <!-- Serif Monogram designed specifically for sharp scaling at tab sizes -->
  <g filter="url(#goldGlow)">
    <text x="256" y="390" 
          font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" 
          font-size="220" 
          font-weight="900" 
          fill="url(#goldGrad)" 
          text-anchor="middle"
          letter-spacing="0">S</text>
  </g>
</svg>
