    <rect x="230" y="380" width="30" height="10"/>
    <rect x="270" y="380" width="20" height="20"/>
    <rect x="300" y="380" width="25" height="10"/>

    <rect x="140" y="400" width="20" height="10"/>
    <rect x="170" y="400" width="30" height="10"/>
    <rect x="210" y="400" width="20" height="10"/>
    <rect x="240" y="400" width="10" height="10"/>
