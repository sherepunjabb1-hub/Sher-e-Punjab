<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c160c"/>
      <stop offset="100%" stop-color="#080808"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF0B9"/>
      <stop offset="25%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#AA771C"/>
      <stop offset="75%" stop-color="#FFDF73"/>
      <stop offset="100%" stop-color="#8B6508"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="250" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="8"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>

  <!-- Ornate Mandala Rings / Rays -->
  <g stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.4" fill="none">
    <circle cx="256" cy="256" r="215"/>
    <circle cx="256" cy="256" r="195"/>
    <path d="M 256 45 Q 266 70 256 95 Q 246 70 256 45 Z" fill="url(#goldGrad)"/>
    <path d="M 256 467 Q 266 442 256 417 Q 246 442 256 467 Z" fill="url(#goldGrad)"/>
    <path d="M 45 256 Q 70 266 95 256 Q 70 246 45 256 Z" fill="url(#goldGrad)"/>
    <path d="M 467 256 Q 442 266 417 256 Q 442 246 467 256 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Inner Crest Circle -->
  <circle cx="256" cy="256" r="170" fill="#120E06" stroke="url(#goldGrad)" stroke-width="4"/>

  <!-- Royal Crown / Diadem above Letter -->
  <path d="M 206 145 L 226 175 L 256 135 L 286 175 L 306 145 L 300 190 L 212 190 Z" fill="url(#goldGrad)"/>
  <circle cx="206" cy="140" r="4" fill="#FFE57F"/>
  <circle cx="256" cy="130" r="5" fill="#FFE57F"/>
  <circle cx="306" cy="140" r="4" fill="#FFE57F"/>

  <!-- Central Royal 'S' Monogram -->
  <text x="256" y="325" 
        font-family="'Playfair Display', 'Cinzel', Georgia, serif" 
        font-size="160" 
        font-weight="bold" 
        fill="url(#goldGrad)" 
        text-anchor="middle"
        letter-spacing="2">S</text>

  <!-- Brand Subtext Curve / Ribbon -->
  <path d="M 170 375 Q 256 405 342 375" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
  <text x="256" y="420" 
        font-family="'Plus Jakarta Sans', sans-serif" 
        font-size="22" 
        font-weight="800" 
        fill="url(#goldGrad)" 
        text-anchor="middle"
        letter-spacing="6">SHER E PUNJAB</text>
  <text x="256" y="445" 
        font-family="'Plus Jakarta Sans', sans-serif" 
        font-size="14" 
        font-weight="600" 
        fill="#FFFFFF" 
        opacity="0.8"
        text-anchor="middle"
        letter-spacing="3">RINCÓN DE LA INDIA</text>
</svg>
