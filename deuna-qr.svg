<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416" />
      <stop offset="50%" stop-color="#1C1B22" />
      <stop offset="100%" stop-color="#0F0E13" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE082" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#997819" />
    </linearGradient>
  </defs>
  <!-- Card Background -->
  <rect x="0" y="0" width="400" height="560" rx="28" fill="url(#cardGrad)" stroke="#D4AF37" stroke-width="2" />
  
  <!-- Header Badges -->
  <g transform="translate(25, 20)">
    <rect x="0" y="0" width="105" height="32" rx="16" fill="#24232C" stroke="#3A3845" stroke-width="1"/>
    <circle cx="16" cy="16" r="8" fill="#10B981" />
    <path d="M12 16 L15 19 L20 13" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="32" y="20" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Rápido</text>

    <rect x="122" y="0" width="105" height="32" rx="16" fill="#24232C" stroke="#3A3845" stroke-width="1"/>
    <circle cx="138" cy="16" r="8" fill="#3B82F6" />
    <path d="M138 10 L144 13 V17 C144 20 138 22 138 22 C138 22 132 20 132 17 V13 Z" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="154" y="20" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Seguro</text>

    <rect x="245" y="0" width="105" height="32" rx="16" fill="#24232C" stroke="#3A3845" stroke-width="1"/>
    <circle cx="261" cy="16" r="8" fill="#8B5CF6" />
    <path d="M257 16 L260 19 L265 13" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="277" y="20" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Simple</text>
  </g>

  <!-- Phone icon badge -->
  <g transform="translate(180, 68)">
    <circle cx="20" cy="20" r="18" fill="#18181B" stroke="#D4AF37" stroke-width="1.5" />
    <rect x="13" y="11" width="14" height="18" rx="2" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
    <circle cx="20" cy="25" r="1" fill="#D4AF37"/>
    <rect x="15" y="14" width="4" height="4" fill="#D4AF37"/>
    <rect x="21" y="14" width="4" height="4" fill="#D4AF37"/>
    <rect x="15" y="19" width="4" height="4" fill="#D4AF37"/>
  </g>

  <!-- QR Frame Container -->
  <rect x="40" y="115" width="320" height="320" rx="20" fill="#FFFFFF" />
  
  <!-- High contrast QR Graphic -->
